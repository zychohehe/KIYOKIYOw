name: Build & Release APK

# Two kinds of release, both built and signed here and picked up by the in-app updater:
#   nightly: every push to main. A pre-release numbered x.y.z.N (N counts up by itself), so only people on the
#            Nightly channel in the app are offered it.
#   stable:  push a tag like v5.6.1, or run this workflow by hand with "stable" ticked. A normal release x.y.z that
#            everyone on the Release channel is offered.
# After a stable release, raise versionName in app/build.gradle.kts to that version so the next nightlies build on top of it.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "fastlane/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      stable:
        description: "Publish a stable release (leave off for a nightly)"
        type: boolean
        default: false
      version:
        description: "Stable version, like 5.6.1 (empty = versionName from app/build.gradle.kts)"
        type: string
        default: ""

permissions:
  contents: write

# a newer push to main replaces a nightly that is still running, but a stable (tag) build is never cancelled:
# every ref gets its own group, so a push to main can't kill the build of a v5.6.1 tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # build numbers continue from the version in app/build.gradle.kts, +1 per workflow run
  BASE_BUILD: 1280
  BASE_CODE: 73

jobs:
  meta:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      code: ${{ steps.v.outputs.code }}
      tag: ${{ steps.v.outputs.tag }}
      stable: ${{ steps.v.outputs.stable }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          INPUT_STABLE: ${{ inputs.stable }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          GRADLE_BASE=$(grep -oP 'versionName = "\K[0-9]+\.[0-9]+\.[0-9]+' app/build.gradle.kts | head -1)
          BASE="$GRADLE_BASE"
          # nightlies build on top of whichever is higher: the version in build.gradle or the newest stable tag, so
          # nobody has to remember to raise versionName after a stable release (5.6.1 stable -> nightlies 5.6.1.1, 5.6.1.2, ...)
          LATEST_STABLE=$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's#.*refs/tags/v##' | grep -P '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -n "$LATEST_STABLE" ] && [ "$(printf '%s\n%s\n' "$BASE" "$LATEST_STABLE" | sort -V | tail -1)" = "$LATEST_STABLE" ]; then
            BASE="$LATEST_STABLE"
          fi
          STABLE=false
          VERSION=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            STABLE=true
            VERSION=$(echo "${GITHUB_REF_NAME#v}" | grep -oP '^[0-9]+\.[0-9]+\.[0-9]+' || true)
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_STABLE" = "true" ]; then
            STABLE=true
            VERSION="${INPUT_VERSION:-$GRADLE_BASE}"
          fi
          if [ "$STABLE" = "true" ]; then
            if ! echo "$VERSION" | grep -qP '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::A stable release needs a version like 5.6.1 (got '$VERSION')"; exit 1
            fi
            TAG="v${VERSION}"
          else
            # nightly: the version in build.gradle plus a counter, 5.6.0.37, which is always newer than the last nightly
            VERSION="${BASE}.${GITHUB_RUN_NUMBER}"
            TAG=""
          fi
          BUILD=$((BASE_BUILD + GITHUB_RUN_NUMBER))
          CODE=$((BASE_CODE + GITHUB_RUN_NUMBER))
          if [ -z "$TAG" ]; then TAG="nightly-${VERSION}-build${BUILD}"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD"     >> "$GITHUB_OUTPUT"
          echo "code=$CODE"       >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "stable=$STABLE"   >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION (build $BUILD) as $TAG, stable=$STABLE"

  # lint runs next to the build instead of in front of it, and no longer holds the release back: the app's Gradle
  # config has abortOnError = false and checkReleaseBuilds = false, so lint never failed a build anyway, it only
  # added its whole running time to every release. A missing resource still stops the build itself (aapt2).
  verify:
    name: Lint (advisory, runs alongside the build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success
      # the runner image usually has both already, so they are only downloaded when one is missing (saves a minute or two)
      - name: Install NDK and CMake (only what is missing)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          PKGS=()
          [ -d "$SDK/ndk/27.0.12077973" ] || PKGS+=("ndk;27.0.12077973")
          [ -d "$SDK/cmake/3.22.1" ] || PKGS+=("cmake;3.22.1")
          if [ "${#PKGS[@]}" -gt 0 ]; then
            echo "Installing: ${PKGS[*]}"
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "${PKGS[@]}" > /dev/null
          else
            echo "NDK and CMake are already on the runner"
          fi
      - name: Lint
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:lintUniversalFossDebug --warning-mode summary

  build:
    name: Build universal APK
    needs: [meta]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # one universal APK only: arm64-v8a, armeabi-v7a, x86 and x86_64 in a single file, so it installs on
    # every device from Android 7 (minSdk 24) through Android 17 (targetSdk 37)
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      # the runner image usually has both already, so they are only downloaded when one is missing (saves a minute or two)
      - name: Install NDK and CMake (only what is missing)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          PKGS=()
          [ -d "$SDK/ndk/27.0.12077973" ] || PKGS+=("ndk;27.0.12077973")
          [ -d "$SDK/cmake/3.22.1" ] || PKGS+=("cmake;3.22.1")
          if [ "${#PKGS[@]}" -gt 0 ]; then
            echo "Installing: ${PKGS[*]}"
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "${PKGS[@]}" > /dev/null
          else
            echo "NDK and CMake are already on the runner"
          fi

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p app/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using the signing key from repository secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
            echo "STORE_PASSWORD=$STORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS_SECRET"           >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET"     >> "$GITHUB_ENV"
          else
            echo "::warning title=Fallback signing key::KEYSTORE_BASE64 secret not set, so this release is signed with the public fallback key. Add KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD in Settings > Secrets > Actions for an official release. Changing the key later makes existing installs unable to update in place."
            echo "No secrets set, using the fallback key in .github/signing (same key every build, so updates install over each other)"
            base64 -d .github/signing/release.keystore.b64 > app/keystore/release.keystore
            echo "STORE_PASSWORD=mochyfork" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=mochy"          >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=mochyfork"   >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
        run: |
          chmod +x gradlew
          # more heap than the 3 GB in gradle.properties: R8 shrinking the whole app thrashes the garbage collector in less
          ./gradlew assembleUniversalFossRelease \
            -PbuildNumber=${{ needs.meta.outputs.build }} \
            -PversionNameOverride=${{ needs.meta.outputs.version }} \
            -PversionCodeOverride=${{ needs.meta.outputs.code }} \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8" \
            --build-cache --parallel \
            --console=plain --warning-mode summary

      - name: Name the APK
        run: |
          mkdir -p dist
          APK=$(ls app/build/outputs/apk/universalFoss/release/*.apk | head -1)
          cp "$APK" "dist/Kiyo_v${{ needs.meta.outputs.version }}_build${{ needs.meta.outputs.build }}_universal.apk"
          ls -lh dist

      # archive: false uploads the APK as it is, so the Actions page gives you the .apk itself and not a zip around it
      - name: Upload APK (not zipped)
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.apk
          archive: false
          retention-days: 7

  release:
    name: Publish release
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # unzipped artifacts are named after their file, so take them all
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum *.apk > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ needs.meta.outputs.stable }}" = "true" ]; then
            KIND="--latest"
          else
            # a nightly is a pre-release, so only the Nightly channel in the app (and not the website) offers it
            KIND="--prerelease --latest=false"
          fi
          gh release create "${{ needs.meta.outputs.tag }}" dist/* \
            --target "${{ github.sha }}" \
            --title "${{ needs.meta.outputs.version }} (${{ needs.meta.outputs.build }})" \
            --generate-notes \
            $KIND
